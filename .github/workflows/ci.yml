name: Integración Continua (CI)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Compilación y Validación de Solución
    runs-on: windows-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Instalar .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependencias NuGet
        run: dotnet restore EchoCut.slnx

      - name: Compilar solución (Release)
        run: dotnet build EchoCut.slnx -c Release --no-restore
